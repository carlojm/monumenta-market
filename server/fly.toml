# fly.toml app configuration file generated for lookoutforyourself on 2026-10-21T23:34:54-04:00
# (i changed the name to lofy instead)
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lofy'
primary_region = 'iad'

[build]

[env]
  DB_PATH = '/data/market.db'
  VERIFY_PORT = '25565'
  PORT = '3001'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]                     # the verify server (Minecraft, raw TCP)
  protocol = 'tcp'
  internal_port = 25565
  processes = ['app']
  auto_stop_machines = 'off'
  [[services.ports]]
    port = 25565
  # At most 25 open Minecraft connections at once; Fly's proxy refuses more,
  # so a flood can't use up the machine. Joins last a second or two.
  [services.concurrency]
    type = 'connections'
    soft_limit = 20
    hard_limit = 25

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
